<main>
<h2>share your feedback</h2>
<p>please fill in the form below to share your thoughts about the couses and the portal.</p>
<form>

<label for="name">name:</label><br>
<input type="text" id="name"
name="name" placeholder="Enter your name">
<br><br>

<label for="email">email:</label><br>
<input  type="email" id="email"
name="email" placeholder="Enter your email">
<br><br>

<label for="phone">phone:</label><br>
<input type="tel" id="phone"
name="phone" placeholder="Enter your phone">
<br><br>

<label>GENDER:</label><br>
<input type="radio" id="female" name="gender" value="female">
<label for="female">female</label>
<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label>

<br><br>

<label for="course">select course:</label><br>
<select id="course" name="course">
<option value="html">HTML & Web fundamentals</option>
<option value="css">CSS</option>
</select>


<br><br>

<label for="feedback">your feedback:</label><br>
<textarea id="feedback" name="feedback" rows="5" cols="40"
placeholder="Write your feedback here"></textarea>

<br><br>

<label>
<input type="checkbox"name="confirm">
i confirm that the information i provide is correct.
</label>

<br><br>
<label for="rating">Rate the portal:</label><br>

<select id="rating" name="rating">
    <option value="5">5 - Excellent</option>
    <option value="4">4 - Very Good</option>
    <option value="3">3 - Good</option>
    <option value="2">2 - Fair</option>
    <option value="1">1 - Poor</option>
</select>
<br>
<br>
<input type="checkbox" id="newsletter" name="newsletter">
<label>subscribe to newsletter and  updates</label>
<br>
<br>
<button type="submit">submit</button>
</form>
